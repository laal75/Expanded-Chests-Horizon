# Horizon Chests: the code half (docs/native-mods.md, "Trait mods"). The blocks, menus and
# recipes are the content mod in ../content. Build with
# `horizon-launcher native-build <this folder> --trust-native-code`.
[mod]
id = "horizon_chests_core"
version = "0.1.0"

# The same Horizon as Horizon Machines, so the two build into one game.
[compatibility]
